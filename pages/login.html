<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Mystic Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-art">
    <div class="auth-art__media"></div>
    <div class="auth-art__scrim"></div>
    <div class="auth-art__content">
      <a href="../index.html" class="auth-art__brand">
        <span class="topbar__mark-glyph">龍</span> Mystic Finance
      </a>
      <div class="auth-art__quote">
        <p>“O tigre não se apressa, mas nunca deixa escapar sua presa.”</p>
        <span>Provérbio &middot; foco financeiro</span>
      </div>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form">
      <a href="../index.html" class="auth-form__back">← Voltar ao início</a>
      <h1>Bem-vindo de volta</h1>
      <p class="auth-form__sub">Ainda não tem conta? <a href="register.html">Crie a sua agora</a>.</p>

      <div class="form-alert form-alert--error" id="formAlert"></div>

      <form id="loginForm" novalidate>
        <div class="field" id="fieldEmail">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
          <p class="field__error">Informe um e-mail válido.</p>
        </div>
        <div class="field" id="fieldPassword">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password" required>
          <p class="field__error">Informe sua senha.</p>
        </div>

        <button type="submit" class="btn btn--primary btn--full auth-submit" id="submitBtn">
          <span class="btn__label" id="submitLabel">Entrar</span>
          <span class="btn__icon">→</span>
        </button>
      </form>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
